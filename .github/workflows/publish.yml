# Runs only while the repository is public (nothing is bumped, tagged or published while it is private), and checks the files to publish for internal names before anything is pushed or published.
#
# Auto-release Bynn.DecisionNode on every push to main: bump the patch in the
# csproj, run the tests, pack, push to NuGet, push the bump commit and tag back
# to main, and cut the GitHub release. The push back uses the default
# GITHUB_TOKEN, which does not retrigger this workflow, and the bump commit
# carries [skip publish] as a second guard.
#
# To ship without cutting a release (docs, CI tweaks), put [skip publish] in
# the commit message.
#
# The tests here are the unit tests; the conformance suite runs in ci.yml.
#
# Needs: the NUGET_API_KEY secret (an API key from nuget.org scoped to push
# Bynn.DecisionNode).
name: Publish to NuGet

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: publish
  cancel-in-progress: false

permissions: read-all

jobs:
  publish:
    if: "github.event.repository.visibility == 'public' && !contains(github.event.head_commit.message, '[skip publish]')"
    runs-on: ubuntu-latest
    environment: nuget-publish
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 8.0.x

      - id: bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          CSPROJ=src/Bynn.DecisionNode/Bynn.DecisionNode.csproj
          CURRENT=$(sed -n 's/.*<Version>\(.*\)<\/Version>.*/\1/p' "$CSPROJ")
          NEW="${CURRENT%.*}.$(( ${CURRENT##*.} + 1 ))"
          sed -i "s|<Version>${CURRENT}</Version>|<Version>${NEW}</Version>|" "$CSPROJ"
          echo "version=${NEW}" >> "$GITHUB_OUTPUT"

      - run: dotnet restore Bynn.DecisionNode.sln
      - run: dotnet build --no-restore -c Release
      - run: dotnet test --no-build -c Release tests/Bynn.DecisionNode.Tests
      - run: dotnet pack --no-build -c Release src/Bynn.DecisionNode/Bynn.DecisionNode.csproj
      - name: Check the files to publish for internal names
        shell: bash
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          set -- src/Bynn.DecisionNode/bin/Release/Bynn.DecisionNode."$VERSION".nupkg src/Bynn.DecisionNode/bin/Release/Bynn.DecisionNode."$VERSION".snupkg
          python3 - "$@" <<'PY'
          # Fails when a file to publish holds an internal name, an internal
          # path or an attribution line. The names are kept only as SHA-256
          # digests of each lowercase word, so this file does not spell them.
          import base64, binascii, hashlib, io, re, sys, tarfile, zipfile
          DIGESTS = {
              "9e9b2efac0b62e4cf6f08cc6b7095e6ad7e18c447458c5849accb698f7149ef3",
              "934a11e602682e862b4b4d1f881ae8da1e097e3f6964bd780e5bb1fb798a6fdd",
              "b7933ed6180d9e2895a9d2df885e2a8b92e998a3c16297581f5b8698daacf492",
              "31d1b3d540ecf85228db7797efbe7d198ec5406abd3f6e64f27f684e9a312d29",
              "2e0b8d61fa2a6959d254b6ff5d0fb512249329097336a35568089933b49abdde",
          }
          PLAIN = re.compile(rb"docs/[0-9]{2}|backend/[0-9]{2}|products/|/users/|co-authored-by|generated with")
          WORD = re.compile(rb"[a-z0-9]+")
          B64 = re.compile(rb"[A-Za-z0-9+/]{8,}={0,2}")

          def named(text):
              return any(hashlib.sha256(w).hexdigest() in DIGESTS for w in set(WORD.findall(text.lower())))

          def faults(data):
              # Bytes as they are, and as UTF-16 for the strings of a .NET assembly.
              views = [data, data.decode("utf-16-le", "ignore").encode("utf-8", "ignore")]
              found = set()
              for view in views:
                  if named(view):
                      found.add("an internal name")
                  for token in B64.findall(view):
                      try:
                          decoded = base64.b64decode(token + b"=" * (-len(token) % 4), validate=True)
                      except (binascii.Error, ValueError):
                          continue
                      if named(decoded):
                          found.add("an internal name in base64")
                  match = PLAIN.search(view.lower())
                  if match:
                      found.add(match.group(0).decode("ascii", "replace"))
              return found

          def members(path, data):
              if zipfile.is_zipfile(io.BytesIO(data)):
                  with zipfile.ZipFile(io.BytesIO(data)) as archive:
                      for name in archive.namelist():
                          yield from members(f"{path}!{name}", archive.read(name))
              elif path.endswith((".crate", ".tar.gz", ".tgz")):
                  with tarfile.open(fileobj=io.BytesIO(data), mode="r:gz") as archive:
                      for member in archive.getmembers():
                          if member.isfile():
                              yield from members(f"{path}!{member.name}", archive.extractfile(member).read())
              else:
                  yield path, data

          bad = 0
          checked = 0
          for path in sys.argv[1:]:
              with open(path, "rb") as handle:
                  for name, data in members(path, handle.read()):
                      checked += 1
                      for fault in sorted(faults(data)):
                          print(f"::error::{name} holds {fault}")
                          bad += 1
          print(f"{checked} files checked")
          sys.exit(1 if bad or not checked else 0)
          PY


      - run: |
          git add src/Bynn.DecisionNode/Bynn.DecisionNode.csproj
          git commit -m "Release v${{ steps.bump.outputs.version }} [skip publish]"
          git tag "v${{ steps.bump.outputs.version }}"
          git push origin HEAD:main "v${{ steps.bump.outputs.version }}"

      - run: dotnet nuget push "src/Bynn.DecisionNode/bin/Release/Bynn.DecisionNode.${{ steps.bump.outputs.version }}.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}

      - run: gh release create "v${{ steps.bump.outputs.version }}" --title "v${{ steps.bump.outputs.version }}" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
