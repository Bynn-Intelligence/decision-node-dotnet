# Release: on every push to main, a dry-run that builds and checks the packages exactly as they
# would be published; on a v* tag, the same dry-run, then the publish of its own files.
#
# Set up by the repository owner (this file creates none of it):
#
# - Environment "release" (Settings > Environments > New environment):
#   - Required reviewers: the people who approve each publish.
#   - Deployment branches and tags: "Selected branches and tags", with the tag rule "v*".
#   - No secrets: nuget.org trusted publishing needs none.
#
# - Repository variable NUGET_USER (Settings > Secrets and variables > Actions > Variables):
#   the nuget.org profile name (not the email address) of the account or organization that owns
#   the package. A name, not a secret.
#
# - nuget.org trusted publishing policy (nuget.org > the account menu > Trusted Publishing >
#   Create), owned by that account or organization:
#     Repository Owner: Bynn-Intelligence
#     Repository:       decision-node-dotnet
#     Workflow File:    release.yml
#     Environment:      release
#   A policy made while the repository is private is active for 7 days and becomes permanent with
#   the first publish; restart the window on nuget.org if it lapses before then.
#   https://learn.microsoft.com/en-us/nuget/nuget-org/trusted-publishing
#
# The publish job exchanges GitHub's OIDC token for a nuget.org API key that lasts one hour and
# pushes the .nupkg (the .snupkg beside it goes with it), then creates the GitHub release with
# that version's CHANGELOG section as the notes.

name: release

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  dry-run:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 8.0.x

      # The version the package must carry: the tag's on a tag, the CHANGELOG's top entry on
      # main. On a tag the CHANGELOG must have that version's section, for the release notes.
      - name: Expected version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
            python3 .github/scripts/changelog.py notes "$version" > /dev/null
          else
            version="$(python3 .github/scripts/changelog.py top)"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Expected version: $version"

      # ContinuousIntegrationBuild makes the build deterministic and maps source paths to /_/,
      # so no path of the build machine ends up in the assembly or its symbols.
      - name: Pack
        run: >
          dotnet pack src/Bynn.DecisionNode
          --configuration Release
          -p:ContinuousIntegrationBuild=true
          --output dist

      - name: Check the packages
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: python3 .github/scripts/check_package.py dist "$VERSION"

      - name: Checksums
        working-directory: dist
        run: sha256sum ./*

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: dry-run
    runs-on: ubuntu-latest
    environment: release
    permissions:
      # The GitHub release.
      contents: write
      # The OIDC token nuget.org exchanges for a one-hour API key.
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      # Only a commit already on main is released: a tag on any other commit stops here.
      - name: Check that the tag is on main
        shell: bash
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          tagged="$(git rev-parse "${GITHUB_REF}^{commit}")"
          if ! git merge-base --is-ancestor "$tagged" refs/remotes/origin/main; then
            echo "::error::${GITHUB_REF_NAME} points at $tagged, which is not on main"
            exit 1
          fi
          echo "${GITHUB_REF_NAME} ($tagged) is on main"

      # The dry-run's own files: nothing is built again.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: package
          path: dist

      - name: Check the downloaded packages
        shell: bash
        run: |
          python3 .github/scripts/check_package.py dist "${GITHUB_REF_NAME#v}"
          (cd dist && sha256sum ./*)

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 8.0.x

      - name: NuGet login (OIDC to a one-hour API key)
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ vars.NUGET_USER }}

      # The .snupkg beside the .nupkg is pushed with it. --skip-duplicate lets a run whose release
      # step failed be re-run without failing on the version already pushed.
      - name: Push to nuget.org
        shell: bash
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: >
          dotnet nuget push "dist/Bynn.DecisionNode.${GITHUB_REF_NAME#v}.nupkg"
          --api-key "$NUGET_API_KEY"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

      - name: GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 .github/scripts/changelog.py notes "${GITHUB_REF_NAME#v}" > release-notes.md
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file release-notes.md \
            --verify-tag
