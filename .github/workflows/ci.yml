name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  # The conformance suite commit this library is tested against (suite 1.11, for
  # specification 1.3). The one place it is set; move it forward deliberately, never to a branch.
  DECISIONNODE_CONFORMANCE_REF: db4305439d1fa4b6a65a47c697401709ad4e1b71

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # The conformance suite: the language-neutral cases and the mock server that
      # every DecisionNode SDK is tested against.
      - name: Check out the conformance suite
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: Bynn-Intelligence/decision-node-conformance
          ref: ${{ env.DECISIONNODE_CONFORMANCE_REF }}
          token: ${{ secrets.DECISIONNODE_CONFORMANCE_TOKEN }}
          path: conformance
          persist-credentials: false

      - name: Python for the mock server
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Unit tests
        run: dotnet test tests/Bynn.DecisionNode.Tests --no-build --configuration Release

      # Starts the mock server and runs every case of the five kinds.
      - name: Run the conformance suite
        env:
          DECISIONNODE_CONFORMANCE_DIR: ${{ github.workspace }}/conformance
        run: dotnet test tests/Bynn.DecisionNode.Conformance --no-build --configuration Release

      - name: Pack (checked, not published)
        run: dotnet pack src/Bynn.DecisionNode --no-build --configuration Release --output artifacts
